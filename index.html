<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<meta name="theme-color" content="#f3f6fa">

<title>은행골 중식</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    background: #f3f6fa;
    color: #222;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans KR",
        "Malgun Gothic",
        sans-serif;

    padding:
        18px 14px 35px;
}

.container {
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
}


/* =========================================
   제목
========================================= */

.header {
    text-align: center;
    margin-bottom: 18px;
}

.header h1 {
    margin: 5px 0 7px;

    font-size: 30px;
    font-weight: 800;

    letter-spacing: -1.5px;
}

.header p {
    margin: 0;

    color: #777;

    font-size: 15px;
}


/* =========================================
   날짜
========================================= */

.date-box {
    background: #ffffff;

    border-radius: 20px;

    padding: 17px;

    margin-bottom: 15px;

    text-align: center;

    box-shadow:
        0 4px 14px rgba(0,0,0,.07);
}

.date {
    font-size: 20px;
    font-weight: 800;
}


/* =========================================
   은행골 카드
========================================= */

.restaurant-card {
    background: #ffffff;

    border-radius: 22px;

    padding: 23px 16px;

    box-shadow:
        0 5px 18px rgba(0,0,0,.08);
}


/* =========================================
   식당 이름
========================================= */

.restaurant-name {
    text-align: center;

    font-size: 28px;

    font-weight: 800;

    margin-bottom: 7px;
}


/* =========================================
   식당 정보
========================================= */

.location {
    text-align: center;

    color: #777;

    font-size: 13px;

    line-height: 1.7;

    margin-bottom: 20px;
}


/* =========================================
   중식 제목
========================================= */

.meal-title {
    text-align: center;

    font-size: 22px;

    font-weight: 800;

    margin-bottom: 15px;
}


/* =========================================
   메뉴
========================================= */

.menu-list {
    display: flex;

    flex-direction: column;

    gap: 9px;
}

.menu-item {
    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 12px;

    padding: 15px 14px;

    background: #f7f8fa;

    border-radius: 13px;
}


/* 메뉴 코너 */

.menu-corner {
    min-width: 82px;

    font-size: 12px;

    font-weight: 700;

    color: #777;

    margin-bottom: 3px;
}


/* 메뉴 이름 */

.menu-name {
    font-size: 17px;

    font-weight: 650;

    line-height: 1.4;
}


/* 가격 */

.menu-price {
    flex-shrink: 0;

    white-space: nowrap;

    font-size: 16px;

    font-weight: 800;
}


/* =========================================
   안내
========================================= */

.notice {
    margin-top: 17px;

    padding: 13px;

    border-radius: 13px;

    background: #f5f6f8;

    color: #888;

    font-size: 12px;

    line-height: 1.6;

    text-align: center;
}


/* =========================================
   하단
========================================= */

.footer {
    text-align: center;

    margin-top: 20px;

    color: #999;

    font-size: 12px;
}


/* =========================================
   작은 휴대폰
========================================= */

@media (max-width: 380px) {

    body {
        padding:
            14px 10px 28px;
    }

    .header h1 {
        font-size: 26px;
    }

    .restaurant-name {
        font-size: 25px;
    }

    .menu-name {
        font-size: 16px;
    }

    .menu-price {
        font-size: 15px;
    }

}

</style>

</head>

<script>

/* =========================================
   오늘 날짜
========================================= */

function showToday() {

    const now = new Date();

    const days = [
        "일요일",
        "월요일",
        "화요일",
        "수요일",
        "목요일",
        "금요일",
        "토요일"
    ];

    const text =
        now.getFullYear() +
        "년 " +
        (now.getMonth() + 1) +
        "월 " +
        now.getDate() +
        "일 " +
        days[now.getDay()];

    document.getElementById(
        "today"
    ).textContent = text;

}

showToday();

</script>
