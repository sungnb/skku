<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<meta name="theme-color" content="#f3f6fa">

<title>은행골 중식</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    padding: 18px 14px 35px;
    background: #f3f6fa;
    color: #222;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans KR",
        "Malgun Gothic",
        sans-serif;
}

.container {
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
}

/* 제목 */
.header {
    text-align: center;
    margin-bottom: 18px;
}

.header h1 {
    margin: 5px 0 7px;
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -1.5px;
}

.header p {
    margin: 0;
    color: #777;
    font-size: 15px;
}

/* 날짜 */
.date-box {
    background: #fff;
    border-radius: 20px;
    padding: 17px;
    margin-bottom: 15px;
    text-align: center;
    box-shadow: 0 4px 14px rgba(0,0,0,.07);
}

.date {
    font-size: 20px;
    font-weight: 800;
}

/* 식당 */
.restaurant-card {
    background: #fff;
    border-radius: 22px;
    padding: 23px 16px;
    box-shadow: 0 5px 18px rgba(0,0,0,.08);
}

.restaurant-name {
    text-align: center;
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 7px;
}

.location {
    text-align: center;
    color: #777;
    font-size: 13px;
    margin-bottom: 20px;
}

/* 중식 표시 */
.meal-title {
    text-align: center;
    font-size: 21px;
    font-weight: 800;
    margin-bottom: 14px;
}

.menu-list {
    display: flex;
    flex-direction: column;
    gap: 9px;
}

.menu-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;

    padding: 15px 14px;

    background: #f7f8fa;
    border-radius: 13px;
}

.menu-name {
    font-size: 17px;
    font-weight: 650;
    line-height: 1.4;
}

.menu-price {
    flex-shrink: 0;
    white-space: nowrap;
    font-size: 16px;
    font-weight: 800;
}

/* 안내 */
.notice {
    margin-top: 17px;
    padding: 13px;
    border-radius: 13px;
    background: #f5f6f8;
    color: #888;
    font-size: 12px;
    line-height: 1.6;
    text-align: center;
}

/* 하단 */
.footer {
    text-align: center;
    margin-top: 20px;
    color: #999;
    font-size: 12px;
}

@media (max-width: 380px) {
    .header h1 {
        font-size: 26px;
    }

    .restaurant-name {
        font-size: 25px;
    }

    .menu-name {
        font-size: 16px;
    }

    .menu-price {
        font-size: 15px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>성균관대 식단</h1>
        <p>인문사회과학캠퍼스</p>
    </div>

    <div class="date-box">
        <div class="date" id="today"></div>
    </div>

    <div class="restaurant-card">

        <div class="restaurant-name">
            은행골식당
        </div>

        <div class="location">
            600주년기념관 지하 1층<br>
            02-740-1926
        </div>

        <div class="meal-title">
            🍚 중식
        </div>

        <div class="menu-list">

            <div class="menu-item">
                <div class="menu-name">
                    누룽지장각백숙
                </div>
                <div class="menu-price">
                    6,500원
                </div>
            </div>

            <div class="menu-item">
                <div class="menu-name">
                    은행골김치찌개
                </div>
                <div class="menu-price">
                    5,000원
                </div>
            </div>

            <div class="menu-item">
                <div class="menu-name">
                    전복반계탕
                </div>
                <div class="menu-price">
                    11,000원
                </div>
            </div>

            <div class="menu-item">
                <div class="menu-name">
                    치즈돈가스
                </div>
                <div class="menu-price">
                    7,000원
                </div>
            </div>

            <div class="menu-item">
                <div class="menu-name">
                    도쿄함박스테이크
                </div>
                <div class="menu-price">
                    10,000원
                </div>
            </div>

            <div class="menu-item">
                <div class="menu-name">
                    치킨가라아게카레라이스
                </div>
                <div class="menu-price">
                    6,500원
                </div>
            </div>

            <div class="menu-item">
                <div class="menu-name">
                    초계국수
                </div>
                <div class="menu-price">
                    8,000원
                </div>
            </div>

        </div>

        <div class="notice">
            은행골식당의 중식 메뉴입니다.
        </div>

    </div>

    <div class="footer">
        성균관대학교 은행골식당
    </div>

</div>

<script>

/* 오늘 날짜 표시 */

function showToday() {

    const now = new Date();

    const days = [
        "일요일",
        "월요일",
        "화요일",
        "수요일",
        "목요일",
        "금요일",
        "토요일"
    ];

    const text =
        now.getFullYear() + "년 " +
        (now.getMonth() + 1) + "월 " +
        now.getDate() + "일 " +
        days[now.getDay()];

    document.getElementById("today").textContent = text;
}

showToday();

</script>

</body>
</html>
