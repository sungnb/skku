<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<link rel="apple-touch-icon" sizes="192x192" href="은행골_아이폰_아이콘_192x192.png">

<meta name="theme-color"
      content="#f3f6fa">

<title>은행골 중식</title>


<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}


html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}


body {

    background: #f3f6fa;

    color: #222;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans KR",
        "Malgun Gothic",
        sans-serif;

    padding:
        18px 14px 35px;

    transition:
        background .2s ease,
        color .2s ease;
}


.container {

    width: 100%;

    max-width: 600px;

    margin: 0 auto;
}


/* =========================================
   날짜
========================================= */

.date-box {

    position: relative;

    background: #ffffff;

    border-radius: 20px;

    padding: 17px;

    margin-bottom: 15px;

    text-align: center;

    box-shadow:
        0 4px 14px rgba(0,0,0,.07);

    transition:
        background .2s ease,
        box-shadow .2s ease;
}


.date {

    font-size: 20px;

    font-weight: 800;
}


/* =========================================
   설정 버튼
========================================= */

.settings {

    position: absolute;

    right: 12px;

    top: 50%;

    transform: translateY(-50%);
}


.settings-button {

    width: 30px;

    height: 30px;

    border: none;

    background: transparent;

    border-radius: 50%;

    font-size: 17px;

    padding: 0;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #777;
}


.settings-button:active {

    background: #eeeeee;
}


/* =========================================
   설정 메뉴
========================================= */

.theme-menu {

    display: none;

    position: absolute;

    right: 0;

    top: 34px;

    width: 105px;

    padding: 5px;

    background: #ffffff;

    border-radius: 11px;

    box-shadow:
        0 4px 16px rgba(0,0,0,.15);

    z-index: 100;

    text-align: left;
}


.theme-menu.show {

    display: block;
}


.theme-option {

    width: 100%;

    border: none;

    background: transparent;

    padding: 8px 9px;

    border-radius: 8px;

    font-size: 13px;

    text-align: left;

    cursor: pointer;

    color: #333;
}


.theme-option:active {

    background: #f0f1f3;
}


/* =========================================
   은행골 카드
========================================= */

.restaurant-card {

    background: #ffffff;

    border-radius: 22px;

    padding: 23px 16px;

    box-shadow:
        0 5px 18px rgba(0,0,0,.08);

    transition:
        background .2s ease,
        box-shadow .2s ease;
}


/* =========================================
   식당 이름
========================================= */

.restaurant-name {

    text-align: center;

    font-size: 28px;

    font-weight: 800;

    margin-bottom: 7px;
}


/* =========================================
   식당 정보
========================================= */

.location {

    text-align: center;

    color: #777;

    font-size: 13px;

    line-height: 1.7;

    margin-bottom: 20px;
}


/* =========================================
   중식 제목
========================================= */

.meal-title {

    text-align: center;

    font-size: 22px;

    font-weight: 800;

    margin-bottom: 15px;
}


/* =========================================
   메뉴
========================================= */

.menu-list {

    display: flex;

    flex-direction: column;

    gap: 9px;
}


.menu-item {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 12px;

    padding: 15px 14px;

    background: #f7f8fa;

    border-radius: 13px;

    transition:
        background .2s ease;
}


.menu-corner {

    min-width: 82px;

    font-size: 12px;

    font-weight: 700;

    color: #777;

    margin-bottom: 3px;
}


.menu-name {

    font-size: 17px;

    font-weight: 650;

    line-height: 1.4;
}


.menu-price {

    flex-shrink: 0;

    white-space: nowrap;

    font-size: 16px;

    font-weight: 800;
}


/* =========================================
   안내
========================================= */

.notice {

    margin-top: 17px;

    padding: 13px;

    border-radius: 13px;

    background: #f5f6f8;

    color: #888;

    font-size: 12px;

    line-height: 1.6;

    text-align: center;

    transition:
        background .2s ease,
        color .2s ease;
}


/* =========================================
   로딩
========================================= */

.loading {

    text-align: center;

    padding: 30px 10px;

    color: #888;

    font-size: 15px;
}


/* =========================================
   오류
========================================= */

.error {

    text-align: center;

    padding: 30px 10px;

    color: #b44;

    font-size: 14px;

    line-height: 1.7;
}


/* =========================================
   메뉴 없음
========================================= */

.no-menu {

    text-align: center;

    padding: 30px 10px;

    color: #888;

    font-size: 15px;

    line-height: 1.7;
}


/* =========================================
   하단
========================================= */

.footer {

    text-align: center;

    margin-top: 20px;

    color: #999;

    font-size: 12px;
}


/* =========================================
   어두운 모드
========================================= */

body.dark {

    background: #17191c;

    color: #eeeeee;
}


body.dark .date-box {

    background: #24272b;

    box-shadow:
        0 4px 14px rgba(0,0,0,.25);
}


body.dark .restaurant-card {

    background: #24272b;

    box-shadow:
        0 5px 18px rgba(0,0,0,.25);
}


body.dark .location {

    color: #aaaaaa;
}


body.dark .menu-item {

    background: #303338;
}


body.dark .menu-corner {

    color: #aaaaaa;
}


body.dark .notice {

    background: #303338;

    color: #aaaaaa;
}


body.dark .settings-button {

    color: #cccccc;
}


body.dark .settings-button:active {

    background: #3a3d42;
}


body.dark .theme-menu {

    background: #303338;

    box-shadow:
        0 4px 16px rgba(0,0,0,.4);
}


body.dark .theme-option {

    color: #eeeeee;
}


body.dark .theme-option:active {

    background: #41444a;
}


body.dark .footer {

    color: #777777;
}


/* =========================================
   작은 휴대폰
========================================= */

@media (max-width: 380px) {

    body {

        padding:
            14px 10px 28px;
    }


    .restaurant-name {

        font-size: 25px;
    }


    .menu-name {

        font-size: 16px;
    }


    .menu-price {

        font-size: 15px;
    }

}

</style>

</head>


<body>


<div class="container">


    <!-- =================================
         날짜
    ================================== -->

    <div class="date-box">

        <div
            class="date"
            id="today">

            불러오는 중...

        </div>


        <!-- 설정 -->

        <div class="settings">

            <button
                class="settings-button"
                id="settingsButton"
                aria-label="화면 설정">

                ⚙

            </button>


            <div
                class="theme-menu"
                id="themeMenu">

                <button
                    class="theme-option"
                    id="lightMode">

                    ☀ 밝게

                </button>


                <button
                    class="theme-option"
                    id="darkMode">

                    🌙 어둡게

                </button>

            </div>

        </div>

    </div>


    <!-- =================================
         은행골
    ================================== -->

    <div class="restaurant-card">


        <div class="restaurant-name">

            은행골식당

        </div>


        <div class="location">

            600주년기념관 지하 1층<br>

            02-740-1926<br>

            중식 11:00~14:00
            (방학 중 11:00~13:30)

        </div>


        <!-- =================================
             중식
        ================================== -->

        <div class="meal-title">

            🍚 중식

        </div>


        <!-- =================================
             메뉴
        ================================== -->

        <div
            class="menu-list"
            id="menuList">

            <div class="loading">

                오늘 메뉴를 불러오는 중입니다...

            </div>

        </div>


        <!-- =================================
             안내
        ================================== -->

        <div
            class="notice"
            id="notice">

            성균관대 공식 식단에서
            봄이온 소반 메뉴를 가져옵니다.

        </div>


    </div>


    <div class="footer">

        성균관대학교 은행골식당

    </div>


</div>


<script>

/* =========================================
   Cloudflare Worker
========================================= */

const WORKER_URL =
    "https://skku.s01021319376.workers.dev/";


const todayElement =
    document.getElementById("today");


const menuList =
    document.getElementById("menuList");


const notice =
    document.getElementById("notice");


/* =========================================
   설정 메뉴
========================================= */

const settingsButton =
    document.getElementById("settingsButton");


const themeMenu =
    document.getElementById("themeMenu");


const lightMode =
    document.getElementById("lightMode");


const darkMode =
    document.getElementById("darkMode");


/* =========================================
   저장된 화면 모드 불러오기
========================================= */

const savedTheme =
    localStorage.getItem("theme");


if (savedTheme === "dark") {

    document.body.classList.add("dark");

}


/* =========================================
   설정 버튼
========================================= */

settingsButton.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        themeMenu.classList.toggle("show");

    }
);


/* =========================================
   밝게
========================================= */

lightMode.addEventListener(
    "click",
    function() {

        document.body.classList.remove("dark");

        localStorage.setItem(
            "theme",
            "light"
        );

        themeMenu.classList.remove("show");

    }
);


/* =========================================
   어둡게
========================================= */

darkMode.addEventListener(
    "click",
    function() {

        document.body.classList.add("dark");

        localStorage.setItem(
            "theme",
            "dark"
        );

        themeMenu.classList.remove("show");

    }
);


/* =========================================
   화면 다른 곳을 누르면 메뉴 닫기
========================================= */

document.addEventListener(
    "click",
    function() {

        themeMenu.classList.remove("show");

    }
);


/* =========================================
   한국시간 오늘 날짜
========================================= */

function getKoreaDate() {

    const parts =
        new Intl.DateTimeFormat(
            "en-CA",
            {
                timeZone: "Asia/Seoul",
                year: "numeric",
                month: "2-digit",
                day: "2-digit"
            }
        ).formatToParts(new Date());


    const result = {};


    for (const part of parts) {

        result[part.type] =
            part.value;

    }


    return (
        result.year +
        "-" +
        result.month +
        "-" +
        result.day
    );
}


/* =========================================
   날짜 표시
========================================= */

function formatDate(dateString) {

    const date =
        new Date(
            dateString + "T00:00:00+09:00"
        );


    const days = [
        "일요일",
        "월요일",
        "화요일",
        "수요일",
        "목요일",
        "금요일",
        "토요일"
    ];


    return (
        date.getFullYear() +
        "년 " +
        (date.getMonth() + 1) +
        "월 " +
        date.getDate() +
        "일 " +
        days[date.getDay()]
    );
}


/* =========================================
   HTML 안전 처리
========================================= */

function escapeHtml(value) {

    return String(value ?? "")

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");
}


/* =========================================
   메뉴 표시
========================================= */

function renderMenus(data) {

    const date =
        data.date ||
        getKoreaDate();


    todayElement.textContent =
        formatDate(date);


    menuList.innerHTML = "";


    const menus =
        Array.isArray(data.menus)
            ? data.menus
            : [];


    /* --------------------------------------
       메뉴 없음
    -------------------------------------- */

    if (menus.length === 0) {

        menuList.innerHTML = `

            <div class="no-menu">

                오늘은 봄이온 소반
                메뉴가 없습니다.<br>

                토요일·일요일 또는
                휴무일일 수 있습니다.

            </div>

        `;


        notice.textContent =
            "해당 날짜에는 봄이온 소반 메뉴가 없습니다.";

        return;

    }


    /* --------------------------------------
       메뉴 표시
    -------------------------------------- */

    menus.forEach(function(menu) {

        const item =
            document.createElement("div");


        item.className =
            "menu-item";


        const price =
            menu.price
                ? escapeHtml(menu.price)
                : "";


        item.innerHTML = `

            <div>

                <div class="menu-corner">

                    봄이온 소반

                </div>

                <div class="menu-name">

                    ${escapeHtml(menu.name)}

                </div>

            </div>


            <div class="menu-price">

                ${price}

            </div>

        `;


        menuList.appendChild(item);

    });


    notice.textContent =
        formatDate(date) +
        " 은행골식당 중식 · 봄이온 소반";

}


/* =========================================
   메뉴 불러오기
========================================= */

async function loadMenu() {

    const date =
        getKoreaDate();


    todayElement.textContent =
        formatDate(date);


    menuList.innerHTML = `

        <div class="loading">

            오늘 메뉴를 불러오는 중입니다...

        </div>

    `;


    try {

        /*
         * cache-busting
         *
         * 브라우저가 전날 자료를
         * 캐시해서 보여주는 것을 방지
         */

        const url =
            WORKER_URL +
            "?date=" +
            encodeURIComponent(date) +
            "&t=" +
            Date.now();


        const response =
            await fetch(
                url,
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.error ||
                "메뉴를 가져오지 못했습니다."
            );

        }


        renderMenus(data);


    } catch (error) {

        console.error(error);


        menuList.innerHTML = `

            <div class="error">

                ❌ 오늘 메뉴를
                가져오지 못했습니다.<br><br>

                ${escapeHtml(error.message)}

            </div>

        `;


        notice.textContent =
            "잠시 후 다시 시도해 주세요.";

    }

}


/* =========================================
   실행
========================================= */

loadMenu();

</script>


</body>

</html>
