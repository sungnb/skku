<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<meta name="theme-color" content="#f3f6fa">

<title>성균관대 은행골 식단</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    padding: 20px 15px 35px;

    background: #f3f6fa;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans KR",
        "Malgun Gothic",
        sans-serif;

    color: #222;
}

.container {
    max-width: 600px;
    margin: 0 auto;
}


/* 제목 */

.header {
    text-align: center;
    margin-bottom: 22px;
}

.header h1 {
    margin: 5px 0 8px;

    font-size: 30px;
    font-weight: 800;

    letter-spacing: -1.5px;
}

.header p {
    margin: 0;

    color: #777;

    font-size: 16px;
}


/* 날짜 */

.date-box {
    background: white;

    border-radius: 20px;

    padding: 18px;

    margin-bottom: 18px;

    text-align: center;

    box-shadow:
        0 4px 15px rgba(0,0,0,.07);
}

.date {
    font-size: 20px;
    font-weight: 700;
}


/* 은행골 카드 */

.restaurant-card {
    background: white;

    border-radius: 22px;

    padding: 25px 20px;

    box-shadow:
        0 5px 18px rgba(0,0,0,.08);

    text-align: center;
}


/* 은행골 이름 */

.restaurant-name {
    font-size: 28px;

    font-weight: 800;

    margin-bottom: 10px;
}


/* 위치 */

.location {
    color: #777;

    font-size: 14px;

    line-height: 1.7;

    margin-bottom: 20px;
}


/* 메뉴 보기 버튼 */

.menu-button {

    display: block;

    width: 100%;

    padding: 18px 10px;

    border-radius: 16px;

    background: #eaf2ff;

    color: #222;

    text-decoration: none;

    font-size: 20px;

    font-weight: 800;

    transition:
        transform .12s ease,
        opacity .12s ease;
}

.menu-button:active {
    transform: scale(.97);
    opacity: .8;
}


/* 설명 */

.description {

    margin-top: 18px;

    color: #888;

    font-size: 13px;

    line-height: 1.7;
}


/* 하단 */

.footer {

    text-align: center;

    margin-top: 22px;

    color: #999;

    font-size: 12px;
}


/* 작은 화면 */

@media (max-width: 380px) {

    .header h1 {
        font-size: 26px;
    }

    .restaurant-name {
        font-size: 25px;
    }

    .menu-button {
        font-size: 18px;
    }

}

</style>

</head>


<body>

<div class="container">


    <!-- 제목 -->

    <div class="header">

        <h1>
            성균관대 식단
        </h1>

        <p>
            인문사회과학캠퍼스
        </p>

    </div>


    <!-- 오늘 날짜 -->

    <div class="date-box">

        <div
            class="date"
            id="today">
        </div>

    </div>


    <!-- 은행골 -->

    <div class="restaurant-card">

        <div class="restaurant-name">

            은행골식당

        </div>


        <div class="location">

            600주년기념관 지하 1층<br>

            ☎ 02-740-1926

        </div>


        <!-- 정확한 은행골 공식 메뉴 주소 -->

        <a
            class="menu-button"
            href="https://www.skku.edu/skku/campus/support/welfare_11.do?mode=info&conspaceCd=10201031&srResId=2&srShowTime=D&srCategory=L">

            🍚 오늘의 은행골 메뉴 보기

        </a>


        <div class="description">

            성균관대학교 공식 식단 페이지로<br>
            이동합니다.

        </div>

    </div>


    <div class="footer">

        성균관대학교 공식 은행골식당 메뉴

    </div>

</div>


<script>

/* 오늘 날짜 */

function showToday() {

    const now = new Date();

    const days = [
        "일요일",
        "월요일",
        "화요일",
        "수요일",
        "목요일",
        "금요일",
        "토요일"
    ];

    const text =
        now.getFullYear() +
        "년 " +
        (now.getMonth() + 1) +
        "월 " +
        now.getDate() +
        "일 " +
        days[now.getDay()];

    document.getElementById(
        "today"
    ).textContent = text;
}

showToday();

</script>

</body>
</html>
